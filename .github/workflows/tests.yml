name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  test:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]

    - name: Run tests (core features only)
      run: |
        pytest tests/ -v --tb=short --ignore=tests/test_pr2_semantic.py --ignore=tests/test_pr3_features.py
      continue-on-error: false

    - name: Test installation
      run: |
        python test_installation.py
      env:
        PYTHONDONTWRITEBYTECODE: 1

  test-with-optional-deps:
    name: Test with optional dependencies
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install with all dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[all,dev]

    - name: Run all tests
      run: |
        pytest tests/ -v --tb=short

    - name: Generate coverage report
      if: matrix.python-version == '3.12'
      run: |
        pip install pytest-cov
        pytest tests/ --cov=taparash_pkg --cov-report=xml --cov-report=html

    - name: Upload coverage to Codecov
      if: matrix.python-version == '3.12'
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
